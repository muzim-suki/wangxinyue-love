<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4e6">
<title>王心月的归来</title>
<style>
  :root{
    --ink:#4a3728;
    --soft:#8a6f5c;
    --cream:#fff4e6;
    --peach:#ff9a76;
    --coral:#ff6f8b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#fffaf0 0%,#fff1de 34%,#ffe7d6 68%,#ffdccd 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 阳光：右上角真的挂着一颗太阳 ---------- */
  .sun-halo{position:fixed;right:-418px;top:-444px;width:980px;height:980px;border-radius:50%;z-index:0;pointer-events:none;
        background:radial-gradient(circle at 50% 50%,rgba(255,241,190,.82) 0%,rgba(255,227,154,.62) 24%,rgba(255,209,142,.3) 42%,rgba(255,206,140,0) 66%)}
  .sun{position:fixed;right:-78px;top:-104px;width:300px;height:300px;border-radius:50%;z-index:0;pointer-events:none;
       background:radial-gradient(circle at 46% 44%,#fffdf4 0%,#fff6d2 24%,#ffe8a9 50%,#ffd283 76%,#ffc374 100%);
       box-shadow:0 0 80px 26px rgba(255,224,152,.85),0 0 190px 90px rgba(255,206,130,.4),0 0 360px 180px rgba(255,214,150,.2);
       filter:blur(1.4px);animation:sunpulse 9s ease-in-out infinite}
  .rays{position:fixed;right:-428px;top:-454px;width:1000px;height:1000px;border-radius:50%;z-index:0;pointer-events:none;opacity:.3;
        background:repeating-conic-gradient(from 0deg,rgba(255,228,175,.9) 0deg 3.2deg,rgba(255,228,175,0) 3.2deg 15deg);
        -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.12) 15%,rgba(0,0,0,.8) 33%,rgba(0,0,0,.24) 52%,transparent 70%);
        mask-image:radial-gradient(circle,rgba(0,0,0,.12) 15%,rgba(0,0,0,.8) 33%,rgba(0,0,0,.24) 52%,transparent 70%);
        animation:spin 150s linear infinite}
  .rays.slow{opacity:.15;animation-duration:300s;animation-direction:reverse}
  .flare{position:fixed;z-index:0;pointer-events:none;border-radius:50%;background:rgba(255,246,220,.9);
         box-shadow:0 0 20px 7px rgba(255,228,170,.55);animation:twinkle 6.5s ease-in-out infinite}
  .f1{width:9px;height:9px;right:118px;top:318px}
  .f2{width:15px;height:15px;right:64px;top:452px;animation-delay:1.4s}
  .f3{width:6px;height:6px;right:196px;top:214px;animation-delay:2.8s}
  /* ---------- 猫爪印 ---------- */
  .paw{position:fixed;z-index:0;pointer-events:none;color:#ff9c86;opacity:.16;
       animation:pawbreathe 7s ease-in-out infinite}
  .cloud{position:fixed;z-index:0;pointer-events:none;filter:blur(18px);opacity:.75;
         background:#fff;border-radius:50%}
  .c1{width:260px;height:96px;left:-70px;top:16%;animation:drift 46s ease-in-out infinite}
  .c2{width:200px;height:74px;right:-60px;top:46%;animation:drift 58s ease-in-out infinite reverse}
  .c3{width:320px;height:110px;left:20%;bottom:-40px;opacity:.55;animation:drift 70s ease-in-out infinite}
  .heart{position:fixed;bottom:-40px;z-index:0;pointer-events:none;color:#ffb6a4;font-size:14px;opacity:0;
         animation:up linear infinite}
  .spark{position:fixed;z-index:0;pointer-events:none;width:6px;height:6px;border-radius:50%;
         background:#fff6cf;box-shadow:0 0 10px rgba(255,214,140,.9);animation:twinkle 4s ease-in-out infinite}
  .sticker-float{position:fixed;z-index:0;pointer-events:none;border-radius:22px;
                 filter:drop-shadow(0 14px 22px rgba(196,146,110,.35));opacity:.95;
                 transition:opacity .7s ease}
  body.stage-on .sticker-float{opacity:0}
  .s1{width:96px;left:-6px;top:12%;transform:rotate(-8deg);animation:bob 7s ease-in-out infinite;opacity:.85}
  .s2{width:84px;right:-8px;top:19%;transform:rotate(7deg);animation:bob 8.5s ease-in-out infinite reverse;opacity:.8}

  /* ---------- 聊天 ---------- */
  .chat{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;
        min-height:100dvh;display:none;flex-direction:column;justify-content:flex-end;
        gap:12px;padding:34px 18px 34px;transition:opacity .62s ease,transform .62s ease,filter .62s ease}
  .chat.leaving{opacity:0;transform:translateY(-18px) scale(.985);filter:blur(4px)}
  .stamp{text-align:center;font-size:11px;letter-spacing:.22em;color:#c2ab9a;margin-bottom:4px}
  .msg{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:9px;opacity:0;animation:msgIn .42s cubic-bezier(.2,1.5,.42,1) forwards}
  @keyframes msgIn{from{opacity:0;transform:translateX(18px) scale(.96)}to{opacity:1;transform:none}}
  .av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;
      box-shadow:0 4px 10px rgba(180,132,100,.22);background:#fff}
  .bubble{position:relative;max-width:84%;background:#fff;color:#43342a;border-radius:16px;
          padding:11px 14px;font-size:15.5px;line-height:1.62;letter-spacing:.01em;
          box-shadow:0 6px 18px rgba(198,152,118,.18);word-break:break-word;
          border:1px solid rgba(255,255,255,.9)}
  .bubble::before{content:"";position:absolute;right:-5px;bottom:14px;width:11px;height:11px;background:#fff;
                  transform:rotate(45deg);border-radius:2px}
  .bubble.sticker{background:none;border:0;box-shadow:none;padding:0}
  .bubble.sticker::before{display:none}
  .stickerimg{width:118px;display:block;border-radius:14px}
  .photoimg{width:100%;max-width:300px;display:block;border-radius:14px}
  .typing{display:flex;gap:5px;padding:14px 16px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#d8c4b4;animation:dots 1.2s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}

  /* ---------- 中间那段字 ---------- */
  .stage{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;min-height:100dvh;
         display:flex;flex-direction:column;justify-content:center;align-items:center;
         padding:64px 28px 84px;text-align:center}
  .eyebrow{font-size:11px;letter-spacing:.52em;padding-left:.52em;color:#c19b7e;margin-bottom:30px}
  .tline{font-family:"Songti SC","STSong","SimSun",serif;font-size:19.5px;line-height:2.15;
         color:#4a3728;margin:0;letter-spacing:.02em;min-height:1.05em}
  .btn-continue{margin-top:38px;appearance:none;border:0;cursor:pointer;font-family:inherit;
        font-size:16px;letter-spacing:.26em;padding:15px 46px 15px 52px;border-radius:999px;color:#fff;
        background:linear-gradient(120deg,#ffb06a,#ff7c8d);
        box-shadow:0 16px 30px -14px rgba(255,120,120,.85);
        animation:rise .55s cubic-bezier(.2,.9,.2,1) both}
  .btn-continue:active{transform:scale(.97)}

  /* ---------- 第二页卡片 ---------- */
  .card{width:100%;max-width:392px;margin:0 auto;padding:34px 24px 30px;border-radius:26px;text-align:center;
        background:linear-gradient(180deg,#ffffff,#fffaf4);
        border:1px solid #ffe3cf;
        box-shadow:0 28px 60px -30px rgba(190,138,104,.55), inset 0 1px 0 #fff;
        animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  /* 第三页：一句话从上面慢慢掉下来、再慢慢化掉；选择面板从左边匀速拉进中间 */
  .falltext{position:fixed;left:0;right:0;top:50%;margin:0;text-align:center;z-index:3;pointer-events:none;
            font-family:"Songti SC","STSong","SimSun",serif;font-size:19px;letter-spacing:.12em;
            color:#6b4d3a;opacity:0;transform:translateY(-50%);text-shadow:0 1px 0 rgba(255,255,255,.75)}
  .falltext.run{animation:fallDrop 2.2s cubic-bezier(.35,.02,.3,1) forwards,
                           fallAway 1.2s 3.3s ease-in forwards}
  @keyframes fallDrop{
    0%{opacity:0;transform:translateY(calc(-50% - 42vh))}
    12%{opacity:1}
    100%{opacity:1;transform:translateY(-50%)}}
  @keyframes fallAway{
    0%{opacity:1;transform:translateY(-50%)}
    100%{opacity:0;transform:translateY(calc(-50% - 18px))}}
  #screen-ask .card{animation:none;opacity:0;transform:translateX(-118%)}
  #screen-ask.slide .card{animation:cardIn 1.45s linear both}
  @keyframes cardIn{
    0%{opacity:0;transform:translateX(-118%)}
    8%{opacity:1;transform:translateX(-105%)}
    100%{opacity:1;transform:translateX(0)}}
  .qtext{font-family:"Songti SC","STSong","SimSun",serif;font-size:17px;line-height:1.95;
         color:#5b4636;margin:0 0 26px}
  .choices{display:flex;flex-direction:column;gap:12px}
  .cbtn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:15.5px;
        padding:15px 18px;border-radius:999px;transition:transform .18s ease,filter .18s ease}
  .cbtn:active{transform:scale(.975)}
  .cbtn.primary{color:#fff;background:linear-gradient(120deg,#ffab73,#ff7f92);
                box-shadow:0 16px 28px -16px rgba(255,130,130,.9)}
  .cbtn.ghost{color:#a9785c;background:#fff7ef;border:1px solid #f6dcc6}
  .body{margin:0 0 22px;font-size:16px;line-height:2;color:#4a3728;white-space:pre-line;text-align:left}
  .photo{width:100%;margin-top:2px;border-radius:16px;display:block}
  .reset{margin-top:4px;padding:10px 14px;border:0;background:none;cursor:pointer;font-family:inherit;
         font-size:12px;letter-spacing:.3em;color:#bfa28d}
  /* 选「你不讨厌我」以后，也用微信那样发出去 */
  #screen-yes,#screen-no{justify-content:flex-end;padding:0 0 16px}
  #screen-yes .chat,#screen-no .chat{display:flex;min-height:0;max-width:430px;justify-content:flex-start;
                    gap:12px;padding:26px 18px 18px;max-height:calc(100dvh - 118px);overflow-y:auto;
                    overscroll-behavior:contain;scrollbar-width:none}
  #screen-yes .chat::-webkit-scrollbar,#screen-no .chat::-webkit-scrollbar{width:0}
  #screen-yes .chat::before,#screen-no .chat::before{content:"";margin-top:auto}
  #screen-yes .reset,#screen-no .reset{margin:10px auto 26px}
  /* 结尾：再选一次（显眼） + 再看一次（低调） */
.endbar{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 24px 30px;margin-top:auto}
.endbar.reveal{animation:endIn .6s ease both}
.reselect{max-width:320px;width:100%;font-size:17px;padding:16px 22px;animation:breath 2.4s ease-in-out infinite}
.reselect:active{transform:scale(.97)}
#screen-no .reset,#screen-yes .reset{font-size:14px;color:#7d6252;text-decoration:underline;text-underline-offset:4px;opacity:1;margin:0;padding:8px 12px}
@keyframes breath{0%,100%{box-shadow:0 8px 20px rgba(255,120,120,.30)}50%{box-shadow:0 16px 36px rgba(255,100,110,.55)}}
@keyframes endIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#noNextWrap{padding:6px 24px 4px;text-align:center}
  #noNextWrap .cbtn{max-width:330px;width:100%}
  .hide{display:none!important}

  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes dots{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
  @keyframes up{0%{opacity:0;transform:translateY(0) scale(.8)}12%{opacity:.9}
                80%{opacity:.5}100%{opacity:0;transform:translateY(-96vh) scale(1.15)}}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
  @keyframes sunpulse{0%,100%{transform:scale(1);opacity:.97}50%{transform:scale(1.022);opacity:1}}
  @keyframes pawbreathe{0%,100%{opacity:.13}50%{opacity:.24}}
  @media (max-width:400px){.s1{width:86px}.s2{width:76px}.tline{font-size:18px}}

  /* ---------- 背景图 ---------- */
  .bgp{position:fixed;inset:0;z-index:-1;pointer-events:none;
       background-position:center;background-size:cover;background-repeat:no-repeat;
       opacity:0;transition:opacity 1.1s ease}
  .bgp.a{background-image:url(img/bg-sky.jpg)}
  .bgp.b{background-image:url(img/bg-cat.jpg)}
  .bgp.on{opacity:.84}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
       background:radial-gradient(115% 70% at 50% 0%,rgba(255,246,234,.4),rgba(255,239,221,.55) 52%,rgba(255,228,206,.74) 100%)}
  .sun{display:none}
  .rays{opacity:.1}
  .rays.slow{opacity:.05}
  .sun-halo{opacity:.55}
  .cloud{opacity:.26}

  /* ---------- 飘带 + 猫爪：一点点引到「继续」 ---------- */
  .guide{position:absolute;inset:0;z-index:0;pointer-events:none}
  .guide svg{width:100%;height:100%;display:block;overflow:visible}
  .guide .path{fill:none;stroke:url(#rg);stroke-width:6.5;stroke-linecap:round;
       stroke-dasharray:200;stroke-dashoffset:200;vector-effect:non-scaling-stroke;
       filter:drop-shadow(0 1px 3px rgba(255,150,130,.45))}
  .guide .path.hi{stroke:#fff6ef;stroke-width:2.1;opacity:.62}
  .guide-on .path{animation:draw 2.9s cubic-bezier(.32,.72,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  #btnContinue{position:relative}
  .paw-stamp{position:absolute;right:-4px;top:-15px;width:34px;height:34px;color:#ff94a4;
    pointer-events:none;opacity:0;transform-origin:50% 85%;filter:drop-shadow(0 2px 3px rgba(214,120,120,.35))}
  .paw-stamp.go{animation:stampIn .5s cubic-bezier(.2,1.35,.35,1) forwards}
  @keyframes stampIn{0%{opacity:0;transform:rotate(208deg) scale(2.4)}
    55%{opacity:.9;transform:rotate(208deg) scale(.92)}
    100%{opacity:1;transform:rotate(208deg) scale(1)}}
  .btn-continue.pressed{animation:btnPress .3s ease-out}
  @keyframes btnPress{50%{transform:scale(.965) translateY(1px)}}
  .gp{position:absolute;width:18px;height:18px;color:#ff9c86;opacity:0;
      transform:translate(-50%,-50%) scale(.6) rotate(var(--r,0deg))}
  .guide-on .gp{animation:pawIn .75s cubic-bezier(.2,1.25,.4,1) forwards;animation-delay:var(--d,0s)}
  @keyframes pawIn{from{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(var(--r,0deg))}
                   to{opacity:.72;transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg))}}
</style>
</head>
<body>

<!-- 背景音乐：一直循环，点「再看一次」也不会重头放 -->
<audio id="bgm" src="bgm.mp4" loop preload="auto"></audio>

<!-- 背景图（第一页 / 第二页） -->
<div id="bgpA" class="bgp a on"></div>
<div id="bgpB" class="bgp b"></div>

<!-- 阳光背景 -->
<div class="sun-halo"></div>
<div class="rays slow"></div>
<div class="rays"></div>
<div class="sun"></div>
<span class="flare f1"></span>
<span class="flare f2"></span>
<span class="flare f3"></span>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<img class="sticker-float s1" src="img/st-tan.jpg" alt="">
<img class="sticker-float s2" src="img/st-chong.jpg" alt="">

<!-- 一：像微信一样一条条跳出来 -->
<div id="chat" class="chat">
  <div class="stamp">刚 刚</div>
</div>

<!-- 二：中间一个字一个字出现 -->
<div id="stage" class="stage hide">
  <div id="guide" class="guide"></div>
  <p class="eyebrow">送 给 王 心 月</p>
  <div id="lines"></div>
  <button id="btnContinue" class="btn-continue hide">继续</button>
</div>

<!-- 三：问她 -->
<div id="screen-ask" class="stage hide">
  <p id="falltext" class="falltext"></p>
  <div class="card">
    <p id="qtext" class="qtext"></p>
    <div class="choices">
      <button id="btnYes" class="cbtn primary">你不讨厌我</button>
      <button id="btnNo" class="cbtn ghost">你讨厌我</button>
    </div>
  </div>
</div>

<!-- 四：她点了「你讨厌我」 -->
<div id="screen-no" class="stage hide">
  <div id="chatNo" class="chat"></div>
  <div id="noNextWrap" class="hide"><button id="btnNoNext" class="cbtn primary"></button></div>
  <div id="endNo" class="endbar hide">
    <button id="btnReselect" class="cbtn primary reselect">再 选 一 次</button>
    <button id="btnReset" class="reset">再 看 一 次</button>
  </div>
</div>

<!-- 五：她点了「你不讨厌我」 -->
<div id="screen-yes" class="stage hide">
  <div id="chatYes" class="chat"></div>
  <div id="endYes" class="endbar hide">
    <button id="btnReselect2" class="cbtn primary reselect">再 选 一 次</button>
    <button id="btnReset2" class="reset">再 看 一 次</button>
  </div>
</div>

<script>
/* ============================================================
   ↓↓↓ 只改这里：文案 + 图片 + 节奏 ↓↓↓
   ============================================================ */
const CONFIG = {
  avatar: "img/avatar.jpg",         // 聊天里的那个小头像

  // 一、微信里一条条跳出来的话
  chat: [
    "王心月的王，是三横一竖的王",
    "王心月的心，是心善的心",
    "王心月的月，是笑起来像月牙",
    "上学辛苦了"
  ],
  chatSticker: "img/st-heart.jpg",  // 最后甩一张表情包，不想要就填 ""

  // 二、屏幕中间一个字一个字打出来的话（一行一句）
  lines: [
    "今天没别的事，",
    "就是有几句话，憋在心里很久了。",
    "怕说太轻，你当玩笑；",
    "怕说得太重，你又躲开。",
    "所以这次，我不绕了。"
  ],

  // 顺序：先放哪个就写哪个。["letter","chat"] = 先那封信再聊天；想换回来写 ["chat","letter"]
  steps: ["letter", "chat"],

  // 三、问她
  fall: "11天的等待我焦急难耐",    // 第三页从上面掉下来的那句
  question: "玩个真心话好不",

  // 四、点了「你讨厌我」
  no: {
    talk: [                                 // 选了「你讨厌我」之后一条一条发出去
      "真的吗",
      "如果是真的那你能和我说说原因吗",
      "想和你道个歉你会看下去吗"
    ],
    nextBtn: "真拿你没办法那我就看看吧",
    photo: "img/no-line.jpg",               // 按下按钮后先发这张图
    talk2: [                                // 再一条一条发这些（一行一条）
      "抱歉，我不应该单方面要求你",
      "也不是想说给自己辩解就是想和你说一下原因，就是想多看看你，会增加一点安全感，为什么会增加",
      "因为我又普信又担心和谨慎",
      "普信就是明明没有身份",
      "但又仗着你对我有好感就一直提要求",
      "担心和谨慎就是你会不会是在玩我或在骗我",
      "因为一个网易云就可以跟萌妹子聊天有点太假了",
      "这种机率太低了",
      "你都看到这里了，那我以后就不提什么要求了"
    ]
  },

  // 五、点了「你不讨厌我」
  yes: {
    talk: [                                 // 选「你不讨厌我」之后，一条一条发出来的消息（一行一条）
      "我就知道嘻嘻嘻",
      "不讨厌就是喜欢谢谢你喜欢我",
      "虽然不知道你是什么类型的喜欢",
      "但是我也不讨厌你哦💚💚💚"
    ],
    image: "",
    imageAlt: "送给你的图片"
  }
};
/* ============================================================
   ↑↑↑ 以上是你要改的部分，下面是逻辑，一般不用动 ↑↑↑
   ============================================================ */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let skip = false;
document.addEventListener("click", () => { skip = true; });

/* ---- 背景音乐：能自己响就自己响，不行就等第一次点屏幕 ---- */
(function bgm(){
  const a = $("bgm");
  if (!a) return;
  a.volume = 0.85;
  const go = function(){
    if (a.paused){ const p = a.play(); if (p && p.catch) p.catch(function(){}); }
  };
  go();
  document.addEventListener("pointerdown", go);
  document.addEventListener("click", go);
})();

if (CONFIG.steps[0] === "letter") document.body.classList.add("stage-on");

/* ---- 背景：星星点点 + 飘心 ---- */
(function decorate(){
  const n = 14;
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.className = "spark";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";
    document.body.appendChild(s);
  }
  for (let i = 0; i < 6; i++){
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = Math.random() > .5 ? "♥" : "✿";
    h.style.left = (8 + Math.random() * 84) + "vw";
    h.style.fontSize = (12 + Math.random() * 8) + "px";
    h.style.animationDuration = (12 + Math.random() * 9).toFixed(1) + "s";
    h.style.animationDelay = (Math.random() * 10).toFixed(1) + "s";
    document.body.appendChild(h);
  }

  // 一串猫爪印，从右下往左上走
  const PAW = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'
    + '<ellipse cx="50" cy="69" rx="27" ry="21" fill="currentColor"/>'
    + '<ellipse cx="22" cy="43" rx="10" ry="13" fill="currentColor"/>'
    + '<ellipse cx="41" cy="30" rx="10.5" ry="13.5" fill="currentColor"/>'
    + '<ellipse cx="61" cy="30" rx="10.5" ry="13.5" fill="currentColor"/>'
    + '<ellipse cx="80" cy="43" rx="10" ry="13" fill="currentColor"/></svg>';
  const PAWS = [[6,88,26,52],[15,85,21,68],[24,79,28,44],[33,72,21,60],[42,66,26,50],
                [51,60,21,66],[60,54,28,46],[69,47,21,62],[78,40,25,48],[87,33,18,64]];
  PAWS.forEach(function(p, i){
    const el = document.createElement("span");
    el.className = "paw";
    el.innerHTML = PAW;
    el.style.left = p[0] + "vw";
    el.style.top = p[1] + "vh";
    el.style.width = el.style.height = p[2] + "px";
    el.style.transform = "rotate(" + p[3] + "deg)";
    el.style.animationDelay = (i * 0.55).toFixed(2) + "s";
    document.body.appendChild(el);
  });
})();

const PAW_SVG = '<svg viewBox="0 0 100 100" width="100%" height="100%">'
  + '<ellipse cx="50" cy="69" rx="27" ry="21" fill="currentColor"/>'
  + '<ellipse cx="22" cy="43" rx="10" ry="13" fill="currentColor"/>'
  + '<ellipse cx="41" cy="30" rx="10.5" ry="13.5" fill="currentColor"/>'
  + '<ellipse cx="61" cy="30" rx="10.5" ry="13.5" fill="currentColor"/>'
  + '<ellipse cx="80" cy="43" rx="10" ry="13" fill="currentColor"/></svg>';

function buildGuide(){
  const box = $("guide");
  box.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">'
    + '<defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#ffe3d5"/><stop offset=".55" stop-color="#ffb7a4"/>'
    + '<stop offset="1" stop-color="#ff8fa6"/></linearGradient></defs>'
    + '<path class="path" d="M 95 0 C 99 9, 91 15, 94 23 C 97 31, 90 37, 93 45 C 96 53, 91 58, 87 62 C 82 66, 75 66, 68 64"/>'
    + '<path class="path hi" d="M 95 0 C 99 9, 91 15, 94 23 C 97 31, 90 37, 93 45 C 96 53, 91 58, 87 62 C 82 66, 75 66, 68 64"/></svg>';
  const G = [[93,2,27,186],[85,7,24,172],[94,12,28,184],[86,18,24,170],[94,24,28,186],
             [87,30,25,172],[94,36,28,186],[88,42,25,174],[92,48,26,188],[86,53,24,178],
             [81,58,26,204],[75,62,24,196]];
  const old = box.querySelectorAll(".gp");
  for (const o of old) o.remove();
  G.forEach(function(p, i){
    const el = document.createElement("span");
    el.className = "gp";
    el.innerHTML = PAW_SVG;
    el.style.left = p[0] + "%";
    el.style.top = p[1] + "%";
    el.style.width = el.style.height = p[2] + "px";
    el.style.setProperty("--r", p[3] + "deg");
    el.style.setProperty("--d", (0.12 + i * 0.28).toFixed(2) + "s");
    box.appendChild(el);
  });
  box.dataset.ms = String(Math.round((0.12 + (G.length - 1) * 0.28) * 1000) + 900);
}

function scrollEnd(){ window.scrollTo(0, document.body.scrollHeight); }

/* ---- 发一条：先「正在输入」三个点，再换成气泡 ---- */
async function sendLine(box, text, my){
  if (my !== runId) return false;
  const t = makeMsg('<div class="bubble typing"><i></i><i></i><i></i></div>');
  box.appendChild(t);
  await sleep(640);
  t.remove();
  const m = makeMsg('<div class="bubble"></div>');
  m.querySelector(".bubble").textContent = text;
  box.appendChild(m);
  box.scrollTop = box.scrollHeight;
  await sleep(760);
  return my === runId;
}

/* ---- 一、聊天：先「正在输入」，再跳出一条 ---- */
function makeMsg(inner){
  const row = document.createElement("div");
  row.className = "msg";
  row.innerHTML = '<img class="av" src="' + CONFIG.avatar + '" alt="">' + inner;
  return row;
}

async function playChat(my){
  document.body.classList.remove("stage-on");
  $("bgpA").classList.remove("on");
  $("bgpB").classList.add("on");
  const chat = $("chat");
  chat.style.display = "flex";
  await sleep(700);
  for (const text of CONFIG.chat){
    if (my !== runId) return;
    const t = makeMsg('<div class="bubble typing"><i></i><i></i><i></i></div>');
    chat.appendChild(t); scrollEnd();
    await sleep(560);
    t.remove();

    const m = makeMsg('<div class="bubble"></div>');
    m.querySelector(".bubble").textContent = text;
    chat.appendChild(m); scrollEnd();
    await sleep(720);
  }
  if (CONFIG.chatSticker){
    const st = makeMsg('<div class="bubble sticker"><img class="stickerimg" src="' + CONFIG.chatSticker + '" alt=""></div>');
    chat.appendChild(st); scrollEnd();
    await sleep(1800);
  }
  chat.classList.add("leaving");
  await sleep(700);
  chat.remove();
}

/* ---- 二、打字机 ---- */
async function typeLine(el, text, speed){
  for (const ch of text){
    el.textContent += ch;
    if (window.innerHeight < document.body.scrollHeight) scrollEnd();
    if (!skip) await sleep(speed);
  }
}

async function playLetter(my){
  document.body.classList.add("stage-on");
  $("bgpA").classList.add("on");
  $("bgpB").classList.remove("on");
  const stage = $("stage");
  stage.classList.remove("hide");
  buildGuide();
  const box = $("lines");
  await sleep(500);
  for (const line of CONFIG.lines){
    const p = document.createElement("p");
    p.className = "tline";
    box.appendChild(p);
    await typeLine(p, line, 82);
    if (!skip) await sleep(300);
  }
  await sleep(240);
  if (my !== runId) return;
  stage.classList.add("guide-on");
  await sleep(Number($("guide").dataset.ms || 5600));
  if (my !== runId) return;
  const btn = $("btnContinue");
  const clicked = new Promise(function(res){ btn.addEventListener("click", res, { once: true }); });
  btn.classList.remove("hide");
  const oldPaw = btn.querySelector(".paw-stamp");
  if (oldPaw) oldPaw.remove();
  const paw = document.createElement("span");
  paw.className = "paw-stamp";
  paw.innerHTML = PAW_SVG;
  btn.appendChild(paw);
  await sleep(160);
  paw.classList.add("go");
  btn.classList.add("pressed");
  await sleep(240);
  btn.classList.remove("pressed");
  await clicked;
  if (my !== runId) return;
  stage.classList.add("hide");
}

/* ---- 三、最后：问她 ---- */
async function showAsk(fast){
  const ask = $("screen-ask");
  const ft = $("falltext");
  const my = runId;
  $("qtext").textContent = CONFIG.question;
  ft.textContent = fast ? "" : (CONFIG.fall || "");
  ft.classList.remove("run");
  ask.classList.remove("slide");
  void ft.offsetWidth;
  ask.classList.remove("hide");
  if (fast){
    await sleep(80);
    if (my !== runId) return;
    ask.classList.add("slide");
    return;
  }
  if (CONFIG.fall){
    ft.classList.add("run");
    await sleep(4300);            // 2.2s 掉下来 + 停 1.1s + 1.2s 化掉
  } else {
    await sleep(150);
  }
  if (my !== runId) return;
  if (skip){ ft.classList.remove("run"); }
  ask.classList.add("slide");
}

/* ---- 四、你讨厌我 ---- */
$("btnNo").addEventListener("click", async () => {
  $("screen-ask").classList.add("hide");
  $("screen-no").classList.remove("hide");
  $("noNextWrap").classList.add("hide");
  const box = $("chatNo");
  const my = runId;
  box.innerHTML = "";
  box.style.display = "flex";
  await sleep(520);
  for (const text of (CONFIG.no.talk || [])){
    if (!await sendLine(box, text, my)) return;
  }
  if (my !== runId) return;
  $("btnNoNext").textContent = CONFIG.no.nextBtn;
  $("noNextWrap").classList.remove("hide");
});

$("btnNoNext").addEventListener("click", async () => {
  $("noNextWrap").classList.add("hide");
  const box = $("chatNo");
  const my = runId;
  if (CONFIG.no.photo){
    const st = makeMsg('<div class="bubble sticker"><img class="photoimg" src="' + CONFIG.no.photo + '" alt=""></div>');
    box.appendChild(st);
    box.scrollTop = box.scrollHeight;
    await sleep(900);
  }
  for (const text of (CONFIG.no.talk2 || [])){
    if (!await sendLine(box, text, my)) return;
  }
  if (my !== runId) return;
  await sleep(500);
  showEnd("endNo");
});

/* ---- 五、你不讨厌我 ---- */
$("btnYes").addEventListener("click", async () => {
  $("screen-ask").classList.add("hide");
  $("screen-yes").classList.remove("hide");
  const box = $("chatYes");
  const my = runId;
  box.innerHTML = "";
  box.style.display = "flex";
  await sleep(520);
  for (const text of (CONFIG.yes.talk || [])){
    if (my !== runId) return;
    const t = makeMsg('<div class="bubble typing"><i></i><i></i><i></i></div>');
    box.appendChild(t);
    await sleep(640);
    t.remove();
    const m = makeMsg('<div class="bubble"></div>');
    m.querySelector(".bubble").textContent = text;
    box.appendChild(m);
    await sleep(760);
  }
  if (my !== runId) return;
  await sleep(500);
  showEnd("endYes");
});

/* ---- 再选一次：清干净，直接回到选择页面 ---- */
let rebooting = false;
let runId = 0;
async function restart(){
  if (rebooting) return;
  rebooting = true;
  skip = false;
  runId++;
  document.body.classList.remove("stage-on");
  const old = $("chat");
  if (old) old.remove();
  const fresh = document.createElement("div");
  fresh.id = "chat";
  fresh.className = "chat";
  fresh.innerHTML = '<div class="stamp">刚 刚</div>';
  const stage = $("stage");
  stage.parentNode.insertBefore(fresh, stage);
  $("lines").innerHTML = "";
  $("screen-ask").classList.remove("slide");
  $("falltext").classList.remove("run");
  $("falltext").textContent = "";
  ["chatYes", "chatNo"].forEach(function(id){ $(id).innerHTML = ""; $(id).style.display = "none"; });
  $("btnContinue").classList.add("hide");
  const op = $("btnContinue").querySelector(".paw-stamp");
  if (op) op.remove();
  stage.classList.add("hide");
  stage.classList.remove("guide-on");
  ["screen-ask", "screen-no", "screen-yes"].forEach(function(id){ $(id).classList.add("hide"); });
  ["endNo", "endYes"].forEach(function(id){ $(id).classList.add("hide"); $(id).classList.remove("reveal"); });
  $("noNextWrap").classList.add("hide");
  $("bgpA").classList.remove("on");
  $("bgpB").classList.add("on");
  window.scrollTo(0, 0);
  await sleep(200);
  rebooting = false;
  showAsk(true);
}

/* ---- 再看一次：整页从头放 ---- */
async function replayFromStart(){
  if (rebooting) return;
  rebooting = true;
  skip = false;
  runId++;
  document.body.classList.remove("stage-on");
  const old = $("chat");
  if (old) old.remove();
  const fresh = document.createElement("div");
  fresh.id = "chat";
  fresh.className = "chat";
  fresh.innerHTML = '<div class="stamp">刚 刚</div>';
  const stage = $("stage");
  stage.parentNode.insertBefore(fresh, stage);
  $("lines").innerHTML = "";
  $("screen-ask").classList.remove("slide");
  $("falltext").classList.remove("run");
  $("falltext").textContent = "";
  ["chatYes", "chatNo"].forEach(function(id){ $(id).innerHTML = ""; $(id).style.display = "none"; });
  $("btnContinue").classList.add("hide");
  const op = $("btnContinue").querySelector(".paw-stamp");
  if (op) op.remove();
  stage.classList.add("hide");
  stage.classList.remove("guide-on");
  ["screen-ask", "screen-no", "screen-yes"].forEach(function(id){ $(id).classList.add("hide"); });
  ["endNo", "endYes"].forEach(function(id){ $(id).classList.add("hide"); $(id).classList.remove("reveal"); });
  $("noNextWrap").classList.add("hide");
  $("bgpA").classList.add("on");
  $("bgpB").classList.remove("on");
  window.scrollTo(0, 0);
  await sleep(240);
  rebooting = false;
  runFlow();
}

/* ---- 结尾按钮只有全部看完才出现 ---- */
function showEnd(which){
  const bar = $(which);
  if (!bar || !bar.classList.contains("hide")) return;
  bar.classList.remove("hide");
  void bar.offsetWidth;
  bar.classList.add("reveal");
}
["btnReselect", "btnReselect2"].forEach(function(id){
  $(id).addEventListener("click", restart);
});
["btnReset", "btnReset2"].forEach(function(id){
  $(id).addEventListener("click", replayFromStart);
});

function setImage(imgId, src, alt){
  const img = $(imgId);
  if (!src){ img.classList.add("hide"); img.removeAttribute("src"); return; }
  img.src = src; img.alt = alt || ""; img.classList.remove("hide");
}

/* ---- 开场 ---- */
async function runFlow(){
  const my = ++runId;
  for (const step of CONFIG.steps){
    if (my !== runId) return;
    if (step === "letter") await playLetter(my);
    else if (step === "chat") await playChat(my);
  }
  if (my !== runId) return;
  showAsk();
}
runFlow();
</script>
